name: CodoRustDesk Windows Release

on:
  push:
    tags:
      - 'v[0-9]*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to the selected tag's GitHub Release (a branch only builds artifacts)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: codo-windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ github.repository != 'rustdesk/rustdesk' }}
    runs-on: ubuntu-22.04
    outputs:
      package-version: ${{ steps.version.outputs.package-version }}
      core-version: ${{ steps.version.outputs.core-version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Validate the version and release target
        id: version
        env:
          REQUEST_PUBLISH: ${{ inputs.publish && 'true' || 'false' }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          cargo = re.search(r'^version\s*=\s*"([^"]+)"', pathlib.Path('Cargo.toml').read_text(), re.M)[1]
          flutter = re.search(r'^version:\s*(\S+)', pathlib.Path('flutter/pubspec.yaml').read_text(), re.M)[1]
          if flutter.split('+')[0] != cargo:
              raise SystemExit('Cargo.toml and flutter/pubspec.yaml versions must match')
          tag = os.environ['GITHUB_REF_NAME'] if os.environ['GITHUB_REF_TYPE'] == 'tag' else ''
          publish = os.environ['GITHUB_EVENT_NAME'] == 'push' or os.environ['REQUEST_PUBLISH'] == 'true'
          if publish and not tag:
              raise SystemExit('Publishing requires a version tag; branch dispatches are build-only')
          if tag:
              match = re.fullmatch(r'v?(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?)', tag)
              if not match:
                  raise SystemExit('Expected a version tag such as v1.5.3 or v1.5.3-office.2')
              version = match[1]
              if re.match(r'\d+\.\d+\.\d+', version)[0] != cargo:
                  raise SystemExit('Tag version must match the Cargo/Flutter application version')
          else:
              version = f"{cargo}-ci.{os.environ['GITHUB_SHA'][:8]}"
          values = {'package-version': version, 'core-version': cargo, 'tag': tag,
                    'publish': str(publish).lower(), 'prerelease': str('-' in version).lower()}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in values.items():
                  print(f'{key}={value}', file=output)
          PY

  bridge:
    needs: prepare
    uses: ./.github/workflows/bridge.yml

  build:
    needs: [prepare, bridge]
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    env:
      VCPKG_ROOT: C:\vcpkg
      VCPKG_COMMIT: 9e593bb18ea69cc5095e012465dcd675a822ed0d
      VCPKG_DEFAULT_TRIPLET: x64-windows-static
      VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
      VCPKG_BINARY_SOURCES: clear;files,C:\vcpkg-binary-cache,readwrite
      CARGO_TARGET_DIR: C:\codo\target
      LIBCLANG_PATH: C:\codo-llvm\bin
      LC_ALL: C
      LC_CTYPE: C
      LANG: C
      PYTHONUTF8: '1'
      PACKAGE_VERSION: ${{ needs.prepare.outputs.package-version }}
      CORE_VERSION: ${{ needs.prepare.outputs.core-version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
      - name: Use a short source path
        run: |
          git config --global core.longpaths true
          New-Item -ItemType Junction -Path C:\codo -Target $env:GITHUB_WORKSPACE | Out-Null
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: .
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install the portable packer dependency
        run: python -m pip install brotli==1.2.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: '1.75.0'
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: codo-windows-flutter
      - uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: '15.0.6'
          directory: C:\codo-llvm
          env: 'false'
      - uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: stable
          flutter-version: '3.24.5'
          architecture: x64
      - name: Prepare the project's Flutter SDK and engine
        run: |
          flutter precache --windows
          if ($LASTEXITCODE -ne 0) { throw 'Flutter precache failed' }
          git -C $env:FLUTTER_ROOT apply "$env:GITHUB_WORKSPACE\.github\patches\flutter_3.24.4_dropdown_menu_enableFilter.diff"
          if ($LASTEXITCODE -ne 0) { throw 'Flutter SDK patch failed' }
          $archive = Join-Path $env:RUNNER_TEMP 'windows-x64-release.zip'
          Invoke-WebRequest https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath "$env:FLUTTER_ROOT\bin\cache\artifacts\engine\windows-x64-release" -Force
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: C:\vcpkg-binary-cache
          key: codo-vcpkg-windows-static-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
      - name: Prepare pinned vcpkg and software-codec libraries
        run: |
          New-Item -ItemType Directory -Force C:\vcpkg-binary-cache | Out-Null
          if (-not (Test-Path C:\vcpkg\.git)) {
            git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
            if ($LASTEXITCODE -ne 0) { throw 'vcpkg clone failed' }
          }
          git -C C:\vcpkg fetch --depth=1 origin $env:VCPKG_COMMIT
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg fetch failed' }
          git -C C:\vcpkg checkout --detach $env:VCPKG_COMMIT
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg checkout failed' }
          & C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap failed' }
          & C:\vcpkg\vcpkg.exe install --classic aom:x64-windows-static libjpeg-turbo:x64-windows-static libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg dependency installation failed' }
      - name: Build Flutter Windows and portable packages
        run: |
          & .\scripts\windows\Build-Flutter-Release.ps1 -ShortSourcePath C:\codo -OutputDirectory "$env:RUNNER_TEMP\codo-release" -PackageVersion $env:PACKAGE_VERSION
      - name: Run the office and connection-parameter tests
        working-directory: C:\codo\flutter
        run: |
          flutter test --no-pub test/office_profile_test.dart test/uri_login_method_test.dart
          if ($LASTEXITCODE -ne 0) { throw 'Flutter tests failed' }
      - name: Verify the portable executable and extracted payload
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'codo-release'
          $base = "CodoRustDesk-$env:PACKAGE_VERSION-windows-x64-Flutter"
          $stdout = Join-Path $env:RUNNER_TEMP 'portable-version.stdout'
          $stderr = Join-Path $env:RUNNER_TEMP 'portable-version.stderr'
          $extracted = Join-Path $env:LOCALAPPDATA 'rustdesk'
          if (Test-Path -LiteralPath $extracted) { throw 'Portable smoke test requires an unused extraction directory' }
          $process = Start-Process -FilePath "$output\$base-portable.exe" -ArgumentList '--version' -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw 'Portable wrapper failed' }
          $versionFound = $false
          for ($attempt = 0; $attempt -lt 10; $attempt++) {
            if ((Get-Content $stdout) -contains $env:CORE_VERSION) { $versionFound = $true; break }
            Start-Sleep -Seconds 1
          }
          if (-not $versionFound) { throw 'Portable child did not report the expected version' }
          $bundle = "$output\$base-Release"
          $count = 0
          foreach ($file in (Get-ChildItem -LiteralPath $bundle -File -Recurse)) {
            $relative = $file.FullName.Substring($bundle.Length + 1)
            $copy = Join-Path $extracted $relative
            if (-not (Test-Path -LiteralPath $copy)) { throw "Missing portable file: $relative" }
            if ((Get-FileHash $file.FullName).Hash -ne (Get-FileHash $copy).Hash) { throw "Portable hash mismatch: $relative" }
            $count++
          }
          Write-Output "Verified portable version and $count extracted payload files."
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codo-windows-release
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/codo-release/*.exe
            ${{ runner.temp }}/codo-release/*.zip
            ${{ runner.temp }}/codo-release/SHA256SUMS.txt

  publish:
    needs: [prepare, build]
    if: ${{ needs.prepare.outputs.publish == 'true' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      PACKAGE_VERSION: ${{ needs.prepare.outputs.package-version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codo-windows-release
          path: dist
      - name: Verify checksums and publish the GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          # PowerShell writes UTF-8 with a BOM on some versions; accept either form.
          sed -i '1s/^\xEF\xBB\xBF//;s/\r$//' dist/SHA256SUMS.txt
          (cd dist && sha256sum --check SHA256SUMS.txt)
          assets=(dist/*.exe dist/*.zip dist/SHA256SUMS.txt)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            cat > release-notes.md <<'EOF'
          Windows x64 Flutter Release，包含软件编解码和办公配置界面。

          - 单文件 portable.exe：双击自解压并运行。
          - ZIP：解压整个目录，运行 rustdesk.exe，保留全部 DLL 和 data 文件夹。
          - SHA256SUMS.txt：EXE 和 ZIP 的 SHA-256 校验值。

          使用公共服务器时，在“设置 → 账户 → 登录”中通过 Google/GitHub 等第三方账号授权。
          本构建未签名；未包含额外显示/打印驱动，未开启可选 hwcodec/vram。
          已通过 Flutter 测试、便携 EXE 版本检查及全部解包文件一致性校验。
          源码版本和构建特性见 ZIP 内的 BUILD-INFO.json。
          EOF
            printf '\nSource: %s/%s/commit/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA" >> release-notes.md
            flags=()
            if [[ "$PRERELEASE" == 'true' ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --title "CodoRustDesk $PACKAGE_VERSION - Windows x64 Flutter" --notes-file release-notes.md "${flags[@]}"
          fi
